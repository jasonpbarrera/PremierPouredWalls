<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme Local Services LLC | Quality craftsmanship. Honest local service.</title>
    <meta name="description" content="Reliable, professional local services tailored to your home and business needs. Quality craftsmanship and honest service you can trust." />

    <!-- Developer & Copyright Attribution -->
    <meta name="author" content="Jason Barrera" />
    <meta name="developer" content="Jason Barrera" />
    <meta name="contact" content="info@example-business.com" />
    <meta name="copyright" content="Copyright © 2026 Acme Local Services LLC" />

    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="Acme Local Services LLC" />
    <meta property="og:description" content="Reliable, professional local services tailored to your home and business needs. Quality craftsmanship and honest service you can trust." />
    <meta property="og:image" content="https://example-business.com/images/logo.jpg" />
    <meta property="og:url" content="https://example-business.com" />
    <meta property="og:type" content="website" />

    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />

    <!-- Favicon Tags -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <link href="SmallBusinessSite.Client.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <script type="importmap"></script>

    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "LocalBusiness",
          "name": "Acme Local Services LLC",
          "image": "https://example-business.com/images/logo.jpg",
          "@id": "https://example-business.com",
          "url": "https://example-business.com",
          "telephone": "(555) 234-5678",
          "address": {
                    "@type": "PostalAddress",
                    "addressLocality": "Springfield",
                    "addressRegion": "TN",
                    "addressCountry": "US"
          },
          "openingHoursSpecification": {
                    "@type": "OpeningHoursSpecification",
                    "dayOfWeek": [
                              "Monday",
                              "Tuesday",
                              "Wednesday",
                              "Thursday",
                              "Friday",
                              "Saturday",
                              "Sunday"
                    ],
                    "opens": "00:00",
                    "closes": "23:59"
          }
}
    </script>
</head>

<body>

    <div id="app">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; font-family:sans-serif;">
            <div class="spinner"></div>
            <p style="margin-top:15px; color:#555;">Loading...</p>
        </div>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
